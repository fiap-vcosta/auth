name: tf-destroy

on:
  workflow_dispatch:

concurrency:
  group: terraform-auth
  cancel-in-progress: false

permissions:
  contents: read
  id-token: write

jobs:
  destroy:
    name: Terraform destroy
    runs-on: ubuntu-latest
    defaults:
      run:
        shell: bash
        working-directory: terraform
    env:
      TF_VAR_jwt_cliente_key: ${{ secrets.JWT_CLIENTE_KEY }}
      TF_VAR_service_auth_key: ${{ secrets.SERVICE_AUTH_KEY }}
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Check required org vars
        working-directory: .
        env:
          GCP_PROJECT_ID: ${{ vars.GCP_PROJECT_ID }}
          GCP_REGION: ${{ vars.GCP_REGION }}
          GCP_AR_REPOSITORY: ${{ vars.GCP_AR_REPOSITORY }}
          GCP_WORKLOAD_IDENTITY_PROVIDER: ${{ vars.GCP_WORKLOAD_IDENTITY_PROVIDER }}
          GCP_SERVICE_ACCOUNT_EMAIL: ${{ vars.GCP_SERVICE_ACCOUNT_EMAIL }}
          JWT_CLIENTE_KEY: ${{ secrets.JWT_CLIENTE_KEY }}
          SERVICE_AUTH_KEY: ${{ secrets.SERVICE_AUTH_KEY }}
          API_BASE_URL: ${{ vars.API_BASE_URL }}
          JWT_CLIENTE_ISSUER: ${{ vars.JWT_CLIENTE_ISSUER }}
          JWT_CLIENTE_AUDIENCE: ${{ vars.JWT_CLIENTE_AUDIENCE }}
        run: |
          missing=()
          for name in GCP_PROJECT_ID GCP_REGION GCP_AR_REPOSITORY \
                      GCP_WORKLOAD_IDENTITY_PROVIDER GCP_SERVICE_ACCOUNT_EMAIL \
                      JWT_CLIENTE_KEY SERVICE_AUTH_KEY; do
            [[ -n "${!name}" ]] || missing+=("$name")
          done
          if (( ${#missing[@]} > 0 )); then
            echo "vars/secrets faltando: ${missing[*]}" >&2
            exit 1
          fi

          # Valores só satisfazem required vars; o destroy usa o state.
          API_BASE_URL="${API_BASE_URL:-https://invalid.example}"
          IMAGE="${GCP_REGION}-docker.pkg.dev/${GCP_PROJECT_ID}/${GCP_AR_REPOSITORY}/auth:latest"
          JWT_CLIENTE_ISSUER="${JWT_CLIENTE_ISSUER:-tech-challenge-cliente}"
          JWT_CLIENTE_AUDIENCE="${JWT_CLIENTE_AUDIENCE:-tech-challenge-cliente}"
          {
            echo "TF_VAR_project_id=$GCP_PROJECT_ID"
            echo "TF_VAR_region=$GCP_REGION"
            echo "TF_VAR_api_base_url=$API_BASE_URL"
            echo "TF_VAR_image=$IMAGE"
            echo "TF_VAR_jwt_cliente_issuer=$JWT_CLIENTE_ISSUER"
            echo "TF_VAR_jwt_cliente_audience=$JWT_CLIENTE_AUDIENCE"
          } >> "$GITHUB_ENV"
      - name: Authenticate to Google Cloud
        uses: google-github-actions/auth@v2
        with:
          workload_identity_provider: ${{ vars.GCP_WORKLOAD_IDENTITY_PROVIDER }}
          service_account: ${{ vars.GCP_SERVICE_ACCOUNT_EMAIL }}

      - name: Setup Terraform
        uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: "1.16.1"
          terraform_wrapper: false

      - name: Terraform init
        run: terraform init -input=false

      - name: Terraform destroy
        run: terraform destroy -input=false -auto-approve
