name: deploy

on:
  workflow_dispatch:
    inputs:
      api_base_url:
        description: "API_BASE_URL (URL pública da API). Vazio = usa a repo/org var API_BASE_URL"
        required: false
        type: string

concurrency:
  group: deploy
  cancel-in-progress: false

permissions:
  contents: read
  id-token: write

env:
  FUNCTION_NAME: auth
  FUNCTION_RUNTIME: nodejs22
  FUNCTION_MEMORY: 256Mi
  FUNCTION_TIMEOUT: 60s
  JWT_CLIENTE_ISSUER_DEFAULT: tech-challenge-cliente
  JWT_CLIENTE_AUDIENCE_DEFAULT: tech-challenge-cliente

jobs:
  deploy:
    name: Deploy Cloud Function
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Check required org vars
        env:
          GCP_PROJECT_ID: ${{ vars.GCP_PROJECT_ID }}
          GCP_REGION: ${{ vars.GCP_REGION }}
          GCP_WORKLOAD_IDENTITY_PROVIDER: ${{ vars.GCP_WORKLOAD_IDENTITY_PROVIDER }}
          GCP_SERVICE_ACCOUNT_EMAIL: ${{ vars.GCP_SERVICE_ACCOUNT_EMAIL }}
        run: |
          missing=()
          for name in GCP_PROJECT_ID GCP_REGION GCP_WORKLOAD_IDENTITY_PROVIDER GCP_SERVICE_ACCOUNT_EMAIL; do
            [[ -n "${!name}" ]] || missing+=("$name")
          done
          if (( ${#missing[@]} > 0 )); then
            echo "org vars faltando: ${missing[*]}" >&2
            exit 1
          fi

      - name: Resolve config
        id: config
        env:
          INPUT_API_BASE_URL: ${{ inputs.api_base_url }}
          VAR_API_BASE_URL: ${{ vars.API_BASE_URL }}
          JWT_CLIENTE_KEY: ${{ secrets.JWT_CLIENTE_KEY }}
          SERVICE_AUTH_KEY: ${{ secrets.SERVICE_AUTH_KEY }}
          JWT_CLIENTE_ISSUER: ${{ vars.JWT_CLIENTE_ISSUER }}
          JWT_CLIENTE_AUDIENCE: ${{ vars.JWT_CLIENTE_AUDIENCE }}
        run: |
          missing=()
          for name in JWT_CLIENTE_KEY SERVICE_AUTH_KEY; do
            [[ -n "${!name}" ]] || missing+=("$name")
          done
          if (( ${#missing[@]} > 0 )); then
            echo "repo secrets faltando: ${missing[*]}" >&2
            exit 1
          fi

          API_BASE_URL="${INPUT_API_BASE_URL:-$VAR_API_BASE_URL}"
          if [[ -z "$API_BASE_URL" ]]; then
            echo "Informe o input api_base_url ou a var API_BASE_URL" >&2
            exit 1
          fi

          JWT_CLIENTE_ISSUER="${JWT_CLIENTE_ISSUER:-$JWT_CLIENTE_ISSUER_DEFAULT}"
          JWT_CLIENTE_AUDIENCE="${JWT_CLIENTE_AUDIENCE:-$JWT_CLIENTE_AUDIENCE_DEFAULT}"

          {
            echo "api_base_url=$API_BASE_URL"
            echo "jwt_cliente_issuer=$JWT_CLIENTE_ISSUER"
            echo "jwt_cliente_audience=$JWT_CLIENTE_AUDIENCE"
          } >> "$GITHUB_OUTPUT"

      - name: Authenticate to Google Cloud
        uses: google-github-actions/auth@v2
        with:
          workload_identity_provider: ${{ vars.GCP_WORKLOAD_IDENTITY_PROVIDER }}
          service_account: ${{ vars.GCP_SERVICE_ACCOUNT_EMAIL }}

      - name: Setup gcloud
        uses: google-github-actions/setup-gcloud@v2

      - name: Deploy Function (2nd gen)
        env:
          API_BASE_URL: ${{ steps.config.outputs.api_base_url }}
          JWT_CLIENTE_KEY: ${{ secrets.JWT_CLIENTE_KEY }}
          JWT_CLIENTE_ISSUER: ${{ steps.config.outputs.jwt_cliente_issuer }}
          JWT_CLIENTE_AUDIENCE: ${{ steps.config.outputs.jwt_cliente_audience }}
          SERVICE_AUTH_KEY: ${{ secrets.SERVICE_AUTH_KEY }}
        run: |
          set -euo pipefail

          echo "::add-mask::$JWT_CLIENTE_KEY"
          echo "::add-mask::$SERVICE_AUTH_KEY"

          # Delimitador | evita quebrar com +/= do base64 em --set-env-vars
          ENV_VARS="^|^API_BASE_URL=${API_BASE_URL}|JWT_CLIENTE_KEY=${JWT_CLIENTE_KEY}|JWT_CLIENTE_ISSUER=${JWT_CLIENTE_ISSUER}|JWT_CLIENTE_AUDIENCE=${JWT_CLIENTE_AUDIENCE}|SERVICE_AUTH_KEY=${SERVICE_AUTH_KEY}"

          gcloud functions deploy "$FUNCTION_NAME" \
            --gen2 \
            --project="${{ vars.GCP_PROJECT_ID }}" \
            --region="${{ vars.GCP_REGION }}" \
            --runtime="$FUNCTION_RUNTIME" \
            --source=. \
            --entry-point=auth \
            --trigger-http \
            --allow-unauthenticated \
            --memory="$FUNCTION_MEMORY" \
            --timeout="$FUNCTION_TIMEOUT" \
            --set-env-vars="$ENV_VARS"

      - name: URL e smoke
        run: |
          set -euo pipefail

          uri="$(gcloud functions describe "$FUNCTION_NAME" \
            --gen2 \
            --project="${{ vars.GCP_PROJECT_ID }}" \
            --region="${{ vars.GCP_REGION }}" \
            --format='value(serviceConfig.uri)')"

          if [[ -z "$uri" ]]; then
            echo "Function sem URI após o deploy" >&2
            exit 1
          fi

          {
            echo "## Function auth no ar"
            echo ""
            echo "- URL: \`$uri\`"
            echo "- Contrato: \`POST $uri\` com body \`{ \"documento\": \"...\" }\`"
            echo "- Runtime: \`$FUNCTION_RUNTIME\` (2nd gen), memória \`$FUNCTION_MEMORY\`"
          } >> "$GITHUB_STEP_SUMMARY"

          echo "FUNCTION_URI=$uri" >> "$GITHUB_ENV"
